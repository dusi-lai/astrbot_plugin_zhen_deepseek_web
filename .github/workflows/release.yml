name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=${GITHUB_REF_NAME#v}
          # git archive 只打包已提交内容，.gitattributes 里已把 .github/dist 排除
          git archive --format=zip --prefix="$NAME/" --output="$NAME-$VERSION.zip" HEAD
          echo "--- zip 内容（前 20 项）---"
          unzip -l "$NAME-$VERSION.zip" | head -20

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
