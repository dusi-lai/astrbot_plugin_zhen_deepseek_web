name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          rm -rf build "$NAME"
          mkdir -p build
          cp -r . "build/$NAME"
          cd build
          rm -rf "$NAME/.git" "$NAME/.github" "$NAME/dist"
          find "$NAME" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$NAME" -name '*.pyc' -delete
          zip -r "../$NAME-${GITHUB_REF_NAME#v}.zip" "$NAME"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
